name: Android TV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Check Termux audit script syntax
        run: bash -n scripts/BOXY_monolith_visual_audit_v3.sh
      - name: Unit tests, lint, debug APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug; then
            find app/build -name 'lint-results-debug.txt' -print -exec cat {} \; || true
            exit 1
          fi
      - name: Upload BOXY test artifact (not a stable signature)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MONOLITH-TV-preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

