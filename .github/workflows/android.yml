name: Android TV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Check Termux audit script syntax
        run: bash -n scripts/BOXY_monolith_visual_audit_v4.sh
      - name: Unit tests, lint, standard and review APKs
        shell: bash
        run: |
          set -o pipefail
          if ! gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleReview :app:assembleCinema; then
            find app/build -name 'lint-results-debug.txt' -print -exec cat {} + || true
            exit 1
          fi
      - name: Prepare isolated BOXY review APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/bridge-review
          cp app/build/outputs/apk/cinema/app-cinema.apk app/build/outputs/bridge-review/app-debug.apk
      - name: Upload CINEMA 0.1.4 APK (preserve old 0.1.3 review)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MONOLITH-TV-preview-debug
          path: app/build/outputs/bridge-review/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload normal preview APK (unchanged package ID)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MONOLITH-TV-standard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload previous review package build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MONOLITH-TV-review-debug
          path: app/build/outputs/apk/review/app-review.apk
          retention-days: 7
          if-no-files-found: error
